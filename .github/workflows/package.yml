# 上架前 CI 打包验证
#
# 用途：在 GitHub 云环境（自带新版 Xcode，可链接 AdMob 11.7.0）构建 Release/Debug 包并产出 ipa，
#       下载回本地安装/测试；上架前验证构建链路，无需本机升级 Xcode。
#       Debug 包用于真机验证隐藏广告面板（5 连点触发，见 QiDrawViewController.m）。
#
# 两种模式（自动判断，依据是否配置签名 secrets）：
#   1) 未提供签名 secrets -> 未签名 ipa（CODE_SIGNING_ALLOWED=NO），可下载后用 Sideloadly 自签安装
#   2) 提供签名 secrets    -> App Store 签名 ipa，可再配合上传流程提交 App Store Connect
#
# 注意：GitHub Actions 的 if: 条件不能直接引用 secrets，因此签名判断用 job 级 env 标志实现。
# 触发：推送 main 自动打包；也可在 Actions 页面手动 Run workflow
name: CI Package (pre-release verification)

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: '构建配置：Release 或 Debug（真机验证广告面板用 Debug）'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
  push:
    branches: [ main ]

jobs:
  package:
    runs-on: macos-latest
    env:
      HAS_CERT: ${{ secrets.DIST_CERT_P12 != '' }}
      CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}
    steps:
      - uses: actions/checkout@v4

      - name: Import distribution certificate
        if: env.HAS_CERT == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.DIST_CERT_P12 }}
          p12-password: ${{ secrets.DIST_CERT_PASSWORD }}

      - name: Install provisioning profile
        if: env.HAS_CERT == 'true'
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "${{ secrets.PROVISIONING_PROFILE }}" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/QiGames.mobileprovision"

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Archive (unsigned by default; signed when cert secrets configured)
        env:
          CERT_P12: ${{ secrets.DIST_CERT_P12 }}
          TEAM_ID: ${{ secrets.DEVELOPER_TEAM_ID }}
          PROFILE_SPECIFIER: ${{ secrets.PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          if [ -n "$CERT_P12" ]; then
            xcodebuild archive \
              -project QiGames.xcodeproj -scheme QiGames \
              -configuration $CONFIGURATION \
              -destination 'generic/platform=iOS' \
              -archivePath build/QiGames.xcarchive \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CODE_SIGN_STYLE=Manual \
              PROVISIONING_PROFILE_SPECIFIER="$PROFILE_SPECIFIER" \
              -allowProvisioningUpdates
          else
            xcodebuild archive \
              -project QiGames.xcodeproj -scheme QiGames \
              -configuration $CONFIGURATION \
              -destination 'generic/platform=iOS' \
              -archivePath build/QiGames.xcarchive \
              CODE_SIGNING_ALLOWED=NO
          fi

      - name: Package ipa
        run: |
          mkdir -p Payload
          cp -R build/QiGames.xcarchive/Products/Applications/QiGames.app Payload/
          zip -q -r -y QiGames.ipa Payload/
          ls -lh QiGames.ipa

      - name: Verify bundle
        run: |
          unzip -t QiGames.ipa > /dev/null && echo "ipa zip OK"
          file Payload/QiGames.app/QiGames
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Payload/QiGames.app/Info.plist

      - uses: actions/upload-artifact@v4
        with:
          name: QiGames-ipa
          path: QiGames.ipa
